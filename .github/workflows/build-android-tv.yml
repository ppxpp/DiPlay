name: Build DiPlay Android TV source APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - name: Provision shared signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Set the SIGNING_KEYSTORE_BASE64 repository secret; values come from scripts/provision-signing.sh."
            exit 1
          fi
          mkdir -p .signing
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > .signing/repack.keystore
          {
            echo "storeFile=.signing/repack.keystore"
            echo "storePassword=$SIGNING_KEYSTORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > .signing/signing.properties
          chmod 600 .signing/signing.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build without authentication assets
        run: ./gradlew -PdiplaySourceOnly=true :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Android-TV-source-only
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
